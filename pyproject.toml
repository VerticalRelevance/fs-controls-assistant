[project]
name = "fs-controls-assistant"
version = "0.1.0"
description = "Financial Services Controls Assistant (training project)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.6",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "controls_assistant"

[dependency-groups]
dev = ["pytest>=8"]
